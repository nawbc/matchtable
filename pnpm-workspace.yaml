packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  '@types/node': ^22
  '@types/react': ^19
  '@types/react-dom': ^19
  typescript: ^6
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
